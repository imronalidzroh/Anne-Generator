<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anne Generator v9.2 - Ultimate Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: #d1d1d1; font-family: 'Inter', sans-serif; }
        .gold-border { border: 1px solid #c5a02e; }
        .gold-text { color: #c5a02e; }
        .gold-bg { background-color: #c5a02e; }
        select { background-color: #0a0a0a; color: #fff; border: 1px solid #222; transition: all 0.2s; appearance: none; cursor: pointer; font-size: 0.72rem; }
        select:focus { border-color: #c5a02e; outline: none; box-shadow: 0 0 15px rgba(197, 160, 46, 0.1); }
        .btn-copy { transition: all 0.2s; }
        .btn-copy:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-copy:active { transform: translateY(0); }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #c5a02e; border-radius: 10px; }
        .section-card { background: #0d0d0d; border: 1px solid #161616; padding: 1.25rem; border-radius: 1rem; }
        .history-item { border-bottom: 1px solid #1a1a1a; transition: background 0.2s; font-size: 0.7rem; }
        .history-item:hover { background: #111; }
        .footer-text { font-size: 0.65rem; color: #666; letter-spacing: 0.05em; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-[1440px] mx-auto">
        <!-- Header -->

            </div>
